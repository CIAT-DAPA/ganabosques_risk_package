name: Ganabosques Risk Package CI/CD

on:
  push:
    branches: [ "main", "stage", "develop" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "stage", "develop" ]

permissions:
  contents: read

jobs:

  TestGanabosquesRisk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Check package installs
        run: |
          pip install .

      - name: Run Unit Tests
        run: |
          python -m unittest discover -s tests -t . -v

  MergeToMain:
    needs: [TestGanabosquesRisk]
    # develop y los pull requests solo corren tests: nunca hacen merge ni release.
    # (ReleaseGanabosquesRisk depende de este job, así que también se omite.)
    if: github.event_name == 'push' && github.ref != 'refs/heads/develop'
    name: Merge Stage with Main
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master

      - name: Merge stage -> main
        uses: devmasx/merge-branch@master
        with:
          type: now
          head_to_merge: ${{ github.ref }}
          target_branch: main
          github_token: ${{ github.token }}

  ReleaseGanabosquesRisk:
    needs: MergeToMain
    name: Create and Upload Release
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: '0'

      - name: Zip Risk Package
        run: zip -r releaseGanabosquesRisk.zip ganabosques_risk_package/ setup.py README.md tests/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GanabosquesRisk
          path: releaseGanabosquesRisk.zip

      - name: Generate Tagname
        id: taggerDryRun
        uses: anothrNick/github-tag-action@1.61.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DRY_RUN: true
          DEFAULT_BUMP: patch
          RELEASE_BRANCHES : stage,main
          BRANCH_HISTORY: last

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag_name: ${{ steps.taggerDryRun.outputs.new_tag }}
          release_name: Release ${{ steps.taggerDryRun.outputs.new_tag }}
          body: ${{ github.event.head_commit.message }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./releaseGanabosquesRisk.zip
          asset_name: releaseGanabosquesRisk.zip
          asset_content_type: application/zip

      - name: Update version in setup.py
        # Acepta comillas simples o dobles y quita la "v" del tag (v0.1.5 -> 0.1.5).
        # Falla si no encuentra la versión, en vez de no hacer nada en silencio.
        run: |
          VERSION="${NEW_TAG#v}"
          sed -i -E "s/version=[\"'][^\"']*[\"']/version=\"${VERSION}\"/" setup.py
          grep -q "version=\"${VERSION}\"" setup.py || { echo "No se pudo actualizar la versión en setup.py"; exit 1; }
        env:
          NEW_TAG: ${{ steps.taggerDryRun.outputs.new_tag }}

      - name: Commit version bump
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Update version to ${{ steps.taggerDryRun.outputs.new_tag }}"